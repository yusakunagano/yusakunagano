<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あまぐもレーダー</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f3f6f9; --panel: #ffffffee; --fg: #13202b; --muted: #5b6b78; --accent: #1f6fd1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e151b; --panel: #18222bee; --fg: #e6eef4; --muted: #93a4b1; --accent: #5aa2ff; color-scheme: dark; }
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #map { position: absolute; inset: 0; }
  #pages { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
           scrollbar-width: none; overscroll-behavior-x: contain; }
  #pages::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100%; height: 100%; position: relative; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; }
  #p1 { overflow-y: auto; background: var(--bg); }
  #edge { position: absolute; top: 0; bottom: 0; right: 0; width: 22px; z-index: 900; }
  #tabs { position: fixed; z-index: 2000; left: 50%; transform: translateX(-50%); top: calc(8px + env(safe-area-inset-top));
          display: flex; background: var(--panel); backdrop-filter: blur(8px); border-radius: 99px; padding: 3px; box-shadow: 0 4px 14px #0003; }
  #tabs button { position: relative; z-index: 1; width: auto; height: 32px; padding: 0 14px; background: none; color: var(--muted);
          font-size: .82rem; font-weight: 700; transition: color .25s; }
  #tabs button[aria-selected="true"] { color: #fff; }
  #tabInk { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 99px; background: var(--accent); transition: transform .3s, width .3s; }
  #swipeHint { position: absolute; z-index: 1000; right: 12px; bottom: calc(150px + env(safe-area-inset-bottom)); font-size: .72rem;
          background: var(--panel); color: var(--muted); padding: 4px 10px; border-radius: 99px; animation: hint 2.4s ease-in-out 3; }
  @keyframes hint { 50% { transform: translateX(-8px); } }
  .wrap { max-width: 560px; margin: 0 auto; padding-top: calc(60px + env(safe-area-inset-top)); padding-bottom: calc(32px + env(safe-area-inset-bottom));
          padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .place small { font-size: .72rem; color: var(--muted); letter-spacing: .08em; }
  .place h1 { margin: 2px 0 0; font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }
  .sec { font-size: .78rem; letter-spacing: .1em; color: var(--muted); margin: 22px 0 8px; font-weight: 700; }
  .note { font-size: .75rem; color: var(--muted); }
  #pins:not(:empty) + #noPins { display: none; }
  #hero .card { padding: 18px 16px 18px 8px; border-radius: 24px; gap: 14px; }
  #hero .card > svg { width: 128px; height: 180px; }
  #hero .ttl { font-size: 1.35rem; }
  #hero .desc { font-size: .92rem; }
  #hero .card::after { font-size: 6rem; bottom: -26px; }
  #hero .big { font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--lvfg); }
  #hero .big small { font-size: 1rem; color: var(--muted); font-weight: 600; margin-left: 6px; }
  .panel {
    position: absolute; z-index: 1000; background: var(--panel); backdrop-filter: blur(6px);
    border-radius: 12px; box-shadow: 0 4px 16px #0003; padding: 10px 14px;
  }
  #ctrl {
    left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right));
    bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  #time { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 6.5em; }
  #tag { font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--muted); color: var(--bg); }
  #tag.fc { background: #e08a00; color: #fff; }
  #slider { flex: 1; accent-color: var(--accent); }
  button {
    border: 0; border-radius: 99px; background: var(--accent); color: #fff; font-size: 1rem;
    width: 40px; height: 40px; cursor: pointer; flex: none;
  }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  #fc {
    top: calc(54px + env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
    max-width: min(360px, calc(100% - 20px)); box-sizing: border-box;
  }
  #fc h2 { margin: 0 0 6px; font-size: .9rem; color: var(--muted); font-weight: 600; }
  #hours { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .h { background: var(--panel); border-radius: 12px; padding: 8px 6px; min-width: 44px; box-shadow: 0 1px 3px #0001; }
  .h { text-align: center; flex: none; font-variant-numeric: tabular-nums; font-size: .8rem; }
  .h b { display: block; font-size: 1.3rem; line-height: 1.4; }
  .h .p { color: var(--accent); }
  #legend { display: flex; gap: 2px; font-size: .65rem; color: var(--muted); align-items: center; }
  #legend i { width: 18px; height: 8px; display: inline-block; }
  .leaflet-image-layer.model { image-rendering: auto; }
  .credit { font-size: .65rem; color: var(--muted); }
  #q { flex: 1; min-width: 0; font-size: 16px; padding: 8px 10px; border-radius: 8px;
       border: 1px solid var(--muted); background: var(--bg); color: var(--fg); }
  #results { list-style: none; margin: 0 0 8px; padding: 0; max-height: 40vh; overflow-y: auto; }
  #results li { padding: 8px 6px; border-bottom: 1px solid #8883; cursor: pointer; font-size: .9rem; }
  #results li:hover { background: #8882; }
  #pins { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  #pins:empty { display: none; }
  #pins li { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: .95rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  #pins .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  #pins .wx { flex: none; } #pins .rp { flex: none; width: 3em; text-align: right; color: var(--accent); }
  #pins li { flex-wrap: wrap; }
  .card { flex-basis: 100%; display: flex; gap: 12px; align-items: center; margin: 4px 0 8px; padding: 10px 12px 10px 6px;
          border-radius: 16px; background: var(--lvbg); position: relative; overflow: hidden; }
  .card::after { content: attr(data-lv); position: absolute; right: 10px; bottom: -14px; font-size: 3.6rem; font-weight: 800;
          color: var(--lvfg); opacity: .14; letter-spacing: -.04em; pointer-events: none; font-variant-numeric: tabular-nums; }
  .card { font-weight: 400; }
  .card > svg { width: 116px; height: 162px; flex: none; filter: drop-shadow(0 3px 4px #0002); }
  .ot { min-width: 0; display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 1; }
  .ot .ttl { font-size: 1.2rem; font-weight: 800; line-height: 1.25; color: var(--lvfg); }
  .ot .desc { font-size: .85rem; line-height: 1.5; }
  .ot .tmp { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ot .tmp b { color: #e5533d; font-weight: 700; } .ot .tmp b.lo { color: #2f7bd8; }
  .warm { display: inline-flex; gap: 3px; align-items: center; font-size: .68rem; color: var(--muted); }
  .warm i { width: 14px; height: 6px; border-radius: 3px; background: #8884; }
  .warm i.on { background: var(--lvfg); }
  .umb { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; font-weight: 700;
         padding: 3px 10px 3px 6px; border-radius: 99px; background: #2f7bd8; color: #fff; }
  .umb.fold { background: #fff; color: #2f7bd8; box-shadow: inset 0 0 0 1.5px #2f7bd8; }
  .umb svg { width: 16px; height: 16px; filter: none; }
  #pinbar { display: flex; gap: 6px; align-items: center; margin: 10px 0 12px; font-size: .8rem; }
  .seg { display: inline-flex; border-radius: 99px; background: #8882; padding: 2px; }
  .seg button { width: auto; height: 26px; padding: 0 10px; font-size: .78rem; background: none; color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  #shareBtn { width: auto; height: 26px; padding: 0 10px; font-size: .78rem; margin-left: auto; }
  #pins button, .ghost { background: none; color: var(--muted); width: 28px; height: 28px; font-size: .9rem; }
  #pinBtn { color: #e0a800; font-size: 1.8rem; width: 44px; height: 44px; }
  #locate { position: absolute; right: max(10px, env(safe-area-inset-right)); top: calc(110px + env(safe-area-inset-top)); z-index: 1000; }
</style>
</head>
<body>
<nav id="tabs" role="tablist">
  <button id="t0" role="tab" aria-selected="true">雨雲レーダー</button>
  <button id="t1" role="tab" aria-selected="false">天気と服装</button>
  <span id="tabInk"></span>
</nav>
<main id="pages">
<section class="page" id="p0" aria-label="雨雲レーダー">
<div id="map"></div>
<div id="edge" aria-hidden="true"></div>
<button id="locate" title="現在地へ移動" aria-label="現在地へ移動">◎</button>
<section id="fc" class="panel">
  <form id="search" class="row" style="gap:6px">
    <input id="q" type="search" placeholder="住所・地名で検索" aria-label="住所検索" autocomplete="off">
    <button type="submit" aria-label="検索" style="width:36px;height:36px">🔍</button>
  </form>
  <ul id="results" hidden></ul>
</section>
<section id="ctrl" class="panel">
  <div class="row">
    <button id="play" aria-label="再生">▶</button>
    <span id="time">--:--</span>
    <span id="tag">実況</span>
  </div>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="時刻">
  <div class="row" style="justify-content:space-between;flex-wrap:wrap">
    <div id="legend">弱
      <i style="background:#f2f2ff"></i><i style="background:#a0d2ff"></i><i style="background:#218cff"></i>
      <i style="background:#0041ff"></i><i style="background:#faf500"></i><i style="background:#ff9900"></i>
      <i style="background:#ff2800"></i><i style="background:#b40068"></i>強
    </div>
    <span class="credit">雨雲: 気象庁 / 予報: Open-Meteo</span>
  </div>
</section>
<div id="swipeHint">← スワイプで天気と服装</div>
</section>

<section class="page" id="p1" aria-label="天気と服装">
 <div class="wrap">
  <header class="ph">
    <div class="place"><small>いま見ている場所</small><h1 id="fcTitle">読み込み中…</h1></div>
    <button id="pinBtn" class="ghost" aria-label="この地点をピン留め" title="ピン留め">☆</button>
  </header>
  <div id="pinbar"><div class="seg"><button id="gM" type="button">👨 男性</button><button id="gF" type="button">👩 女性</button></div><button id="shareBtn" type="button">共有</button></div>
  <div id="hero"></div>
  <h2 class="sec">24時間の天気</h2>
  <div id="hours"></div>
  <h2 class="sec">ピン留めした場所</h2>
  <ul id="pins" aria-label="ピン留めした地点"></ul>
  <p id="noPins" class="note">レーダー画面で場所を検索して ☆ を押すと、ここに服装つきで並びます。</p>
  <p class="note">雨雲: 気象庁 / 予報: Open-Meteo / 地図: 国土地理院</p>
 </div>
</section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const JMA = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/';
const map = L.map('map', { zoomControl: false }).setView([35.68, 139.76], 8);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
}).addTo(map);

let frames = [], layers = {}, idx = 0, timer = null;
const slider = document.getElementById('slider');

function fmt(t) { // "20261122123500" (UTC) -> "21:35"
  const d = new Date(Date.UTC(+t.slice(0,4), +t.slice(4,6)-1, +t.slice(6,8), +t.slice(8,10), +t.slice(10,12)));
  const opt = { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo' };
  const day = k => k.toLocaleDateString('ja-JP', { day: 'numeric', timeZone: 'Asia/Tokyo' });
  return (day(d) !== day(new Date()) ? '翌' : '') + d.toLocaleTimeString('ja-JP', opt);
}

// ---- モデル予報（Open-Meteo / 気象庁MSM）を地図に色付けする ----
const GRID = 7; // 7×7=49地点。Open-Meteo の利用回数上限に気をつけて少なめにする
let model = null; // { bounds, times[], grid[point][hour] }
function rainColor(mm) {
  if (mm < 0.1) return null;
  const s = [[1,'242,242,255'],[5,'160,210,255'],[10,'33,140,255'],[20,'0,65,255'],[30,'250,245,0'],[50,'255,153,0'],[80,'255,40,0']];
  for (const [t, c] of s) if (mm < t) return c;
  return '180,0,104';
}
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) {
    let reason = ''; try { reason = (await r.json()).reason || ''; } catch {}
    throw new Error(r.status === 429 ? 'アクセスが集中しています。1分ほど待ってから開き直してください' : `エラー ${r.status} ${reason}`);
  }
  return r.json();
}
async function loadModel() {
  // 30分以内に取得済みで、今の表示範囲が収まっていれば取り直さない
  if (model && Date.now() - model.at < 30 * 60e3 && model.bounds.contains(map.getBounds())) return;
  const b = map.getBounds().pad(0.5), pts = [];
  for (let i = 0; i < GRID; i++) for (let j = 0; j < GRID; j++)
    pts.push([b.getNorth() - (b.getNorth() - b.getSouth()) * (i + .5) / GRID, b.getWest() + (b.getEast() - b.getWest()) * (j + .5) / GRID]);
  const url = 'https://api.open-meteo.com/v1/forecast?models=jma_seamless&hourly=precipitation&forecast_hours=26&timezone=GMT' +
    '&latitude=' + pts.map(p => p[0].toFixed(2)).join(',') + '&longitude=' + pts.map(p => p[1].toFixed(2)).join(',');
  let d = await getJSON(url);
  if (!Array.isArray(d)) d = [d];
  model = { at: Date.now(), bounds: b, times: d[0].hourly.time.map(t => t.replace(/[-T:]/g, '') + '00'), grid: d.map(x => x.hourly.precipitation) };
}
function modelLayer(f) {
  const c = document.createElement('canvas'); c.width = c.height = GRID;
  const g = c.getContext('2d'), img = g.createImageData(GRID, GRID), h = model.times.indexOf(f.validtime);
  model.grid.forEach((series, k) => {
    const col = rainColor(series[h] ?? 0);
    if (col) { const [r, gg, bb] = col.split(',').map(Number); img.data.set([r, gg, bb, 255], k * 4); }
  });
  g.putImageData(img, 0, 0);
  return L.imageOverlay(c.toDataURL(), model.bounds, { opacity: 0, className: 'model' }).addTo(map);
}

function layerFor(f) {
  const key = f.basetime + f.validtime;
  if (!layers[key] && f.model) layers[key] = modelLayer(f);
  if (!layers[key]) {
    layers[key] = L.tileLayer(f.rasrf
      ? `https://www.jma.go.jp/bosai/jmatile/data/rasrf/${f.basetime}/none/${f.validtime}/surf/rasrf/{z}/{x}/{y}.png`
      : `${JMA}${f.basetime}/none/${f.validtime}/surf/hrpns/{z}/{x}/{y}.png`, {
      opacity: 0, maxNativeZoom: 10, minNativeZoom: 4, maxZoom: 18,
      attribution: '<a href="https://www.jma.go.jp/bosai/nowc/" target="_blank">気象庁</a>'
    }).addTo(map);
  }
  return layers[key];
}

function show(i) {
  idx = i; slider.value = i;
  const f = frames[i];
  frames.forEach((g, j) => { const l = layers[g.basetime + g.validtime]; if (l) l.setOpacity(j === i ? 0.75 : 0); });
  layerFor(f).setOpacity(0.75);
  // 次のフレームを先読み
  if (frames[i + 1]) layerFor(frames[i + 1]);
  document.getElementById('time').textContent = fmt(f.validtime);
  const tag = document.getElementById('tag');
  tag.textContent = f.model ? 'モデル予報（粗い）' : f.rasrf ? '予測（1時間ごと）' : f.fc ? '予測' : '実況';
  tag.classList.toggle('fc', f.fc);
}

async function loadRadar() {
  const [n1, n2] = await Promise.all(['N1', 'N2'].map(n =>
    fetch(`${JMA}targetTimes_${n}.json`).then(r => r.json())));
  const byTime = (a, b) => a.validtime.localeCompare(b.validtime);
  const past = n1.filter(f => f.elements.includes('hrpns')).sort(byTime).slice(-36); // 過去3時間（5分ごと）
  const fut = n2.filter(f => f.elements.includes('hrpns')).sort(byTime).map(f => ({ ...f, fc: true }));
  // 降水短時間予報（1時間ごと・約15時間先まで）。最新の発表分だけ使い、ナウキャストより先の時刻をつなげる
  let longFc = [];
  try {
    const rs = (await (await fetch('https://www.jma.go.jp/bosai/jmatile/data/rasrf/targetTimes.json')).json())
      .filter(f => f.elements.includes('rasrf'));
    const latest = rs.reduce((m, f) => f.basetime > m ? f.basetime : m, '');
    const last = (fut.at(-1) || past.at(-1)).validtime;
    longFc = rs.filter(f => f.basetime === latest && f.validtime > last).sort(byTime)
      .map(f => ({ ...f, fc: true, rasrf: true }));
  } catch {}
  frames = [...past, ...fut, ...longFc];
  // 気象庁データの先は、モデル予報で24時間先までつなげる
  try {
    await loadModel();
    const last = frames.at(-1).validtime, end = new Date(Date.now() + 24 * 3600e3).toISOString().replace(/[-T:]/g, '').slice(0, 14);
    frames.push(...model.times.filter(t => t > last && t <= end).map(t => ({ basetime: 'm', validtime: t, fc: true, model: true })));
  } catch {}
  slider.max = frames.length - 1;
  show(past.length - 1); // 現在
}

function togglePlay() {
  const btn = document.getElementById('play');
  if (timer) { clearInterval(timer); timer = null; btn.textContent = '▶'; btn.ariaLabel = '再生'; return; }
  btn.textContent = '❚❚'; btn.ariaLabel = '停止';
  timer = setInterval(() => show((idx + 1) % frames.length), 600);
}
document.getElementById('play').onclick = togglePlay;
slider.oninput = () => show(+slider.value);

// ---- 地点の予報 (Open-Meteo) ----
const WX = c => c === 0 ? '☀️' : c <= 2 ? '🌤' : c === 3 ? '☁️' : c <= 48 ? '🌫' :
  c <= 67 || (c >= 80 && c <= 82) ? '🌧' : c <= 77 || c === 85 || c === 86 ? '🌨' : '⛈';

async function loadForecast(lat, lon, name) {
  document.getElementById('fcTitle').textContent = name;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}` +
    `&hourly=temperature_2m,precipitation_probability,weather_code&timezone=Asia%2FTokyo&forecast_hours=24` +
    '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max&forecast_days=1';
  try {
    const x = await getJSON(url), d = x.hourly;
    heroWx = { temp: x.current.temperature_2m, code: x.current.weather_code, rain: x.daily.precipitation_probability_max[0] ?? 0,
      max: x.daily.temperature_2m_max[0], min: x.daily.temperature_2m_min[0], wind: x.daily.wind_speed_10m_max[0] ?? 0, psum: x.daily.precipitation_sum[0] ?? 0 };
    renderHero();
    document.getElementById('hours').innerHTML = d.time.map((t, i) => `
      <div class="h">${+t.slice(11, 13)}時<b>${WX(d.weather_code[i])}</b>
      ${Math.round(d.temperature_2m[i])}°<br><span class="p">${d.precipitation_probability[i] ?? '-'}%</span></div>`).join('');
  } catch (e) { document.getElementById('hours').textContent = '予報を取得できませんでした（' + (e.message || '通信エラー') + '）'; }
}

let marker, current = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function setPoint(lat, lon, name) {
  current = { lat, lon, name };
  if (marker) marker.setLatLng([lat, lon]); else marker = L.marker([lat, lon]).addTo(map);
  loadForecast(lat, lon, name);
  updatePinBtn();
}

// ---- ピン留め（この端末のブラウザに保存）----
let pins = [];
try { pins = JSON.parse(localStorage.getItem('pins') || '[]'); } catch {}
const savePins = () => { try { localStorage.setItem('pins', JSON.stringify(pins)); } catch {} };
const pinIndex = () => current ? pins.findIndex(p => Math.abs(p.lat - current.lat) < 1e-4 && Math.abs(p.lon - current.lon) < 1e-4) : -1;

function updatePinBtn() {
  const on = pinIndex() >= 0, b = document.getElementById('pinBtn');
  b.textContent = on ? '★' : '☆';
  b.ariaLabel = b.title = on ? 'ピン留めを外す' : 'この地点をピン留め';
}
let pinWx = [];
let gender = 'M';
try { gender = localStorage.getItem('gender') || 'M'; } catch {}
function setGender(g) {
  gender = g;
  try { localStorage.setItem('gender', g); } catch {}
  document.getElementById('gM').ariaPressed = g === 'M';
  document.getElementById('gF').ariaPressed = g === 'F';
  renderPins();
}
document.getElementById('gM').onclick = () => setGender('M');
document.getElementById('gF').onclick = () => setGender('F');

// 最高・最低気温、降水確率、風から服装を決める
function outfit(w) {
  const F = gender === 'F';
  const feel = w.max - Math.max(0, w.wind - 18) / 6; // 風が強いと体感を下げる
  let o;
  if (feel >= 27) o = { lv: 1, title: '真夏の装い', top: 'tee', bottom: F ? 'dress' : 'shorts', text: F ? 'ノースリーブや半袖のワンピースで涼しく' : '半袖Tシャツにショートパンツで' };
  else if (feel >= 22) o = { lv: 1, title: '半袖でちょうどいい', top: 'tee', bottom: F ? 'skirt' : 'pants', text: F ? '半袖ブラウスにスカートで' : '半袖シャツにチノパンで' };
  else if (feel >= 18) o = { lv: 2, title: '長袖1枚で', top: 'long', bottom: F ? 'skirt' : 'pants', text: F ? '長袖ブラウスや薄手ニットで' : '長袖シャツ1枚で' };
  else if (feel >= 15) o = { lv: 2, title: '薄着にカーディガン', top: 'long', outer: 'cardigan', bottom: F ? 'skirt' : 'pants', text: '長袖に薄手のカーディガンを羽織って' };
  else if (feel >= 11) o = { lv: 3, title: 'ジャケットを羽織る', top: 'long', outer: F ? 'trench' : 'jacket', bottom: 'pants', text: F ? 'ニットにトレンチコートを' : 'セーターにジャケットを' };
  else if (feel >= 6) o = { lv: 4, title: 'コートとマフラー', top: 'long', outer: 'coat', bottom: F ? 'skirt' : 'pants', tights: F, scarf: true, text: F ? 'ウールコートにマフラー、タイツで' : '厚手のコートにマフラーを' };
  else o = { lv: 5, title: 'ダウンで完全防寒', top: 'long', outer: 'down', bottom: 'pants', scarf: true, gloves: true, text: 'ダウンジャケットにマフラーと手袋を' };
  if (w.max - w.min >= 10 && o.lv <= 2 && !o.outer) { o.outer = 'cardigan'; o.text += '。朝晩は冷えるので羽織りものを'; }
  // 傘：雨が多い・確率が高いなら長傘、少しだけなら折りたたみ
  if (w.rain >= 60 || (w.rain >= 40 && (w.psum ?? 0) >= 3)) o.umb = 'long';
  else if (w.rain >= 30) o.umb = 'fold';
  return o;
}
const UMB = { long: '長傘を持って出かけよう', fold: '折りたたみ傘をカバンに' };
const LV = [null, ['#ffd9a8', '#c2560f'], ['#ffeec2', '#a87400'], ['#d9eecf', '#3c7d2c'], ['#d3e3f6', '#2a64b0'], ['#d8d6f6', '#4b3fb0']];

// 服を着た人物のイラスト（SVG）
function figure(o) {
  const F = gender === 'F', skin = '#f3c9a6', hair = F ? '#5a3a2a' : '#2f2a28';
  const topC = { tee: F ? '#ff8fa3' : '#5ec2b7', long: F ? '#f4f1ea' : '#8fb3e0' }[o.top];
  const outC = { cardigan: '#c9a6e8', jacket: '#6b7b8c', trench: '#c8a67a', coat: F ? '#b5484c' : '#3d4a5c', down: F ? '#f0eee8' : '#1f2a44' }[o.outer];
  const botC = o.bottom === 'shorts' ? '#c9b38a' : o.bottom === 'dress' ? topC : o.bottom === 'skirt' ? '#3f4b6e' : '#2e3a59';
  const legC = o.tights ? '#3a3340' : skin;
  const len = { cardigan: 86, jacket: 88, trench: 106, coat: 104, down: 92 }[o.outer] || 0;
  const sleeveSkin = o.top === 'tee' && !o.outer;
  let g = '';
  // 後ろ髪
  if (F) g += `<path d="M34 24 Q34 6 50 6 Q66 6 66 24 L68 44 Q50 50 32 44 Z" fill="${hair}"/>`;
  // 脚
  if (o.bottom === 'pants') g += `<rect x="37" y="80" width="12" height="50" rx="4" fill="${botC}"/><rect x="51" y="80" width="12" height="50" rx="4" fill="${botC}"/>`;
  else {
    g += `<rect x="39" y="90" width="9" height="40" rx="4" fill="${legC}"/><rect x="52" y="90" width="9" height="40" rx="4" fill="${legC}"/>`;
    if (o.bottom === 'shorts') g += `<path d="M35 80 H65 L66 100 H52 L50 92 L48 100 H34 Z" fill="${botC}"/>`;
    else g += `<path d="M35 80 H65 L72 ${o.bottom === 'dress' ? 112 : 108} H28 Z" fill="${botC}"/>`;
  }
  // 靴
  g += `<ellipse cx="42" cy="132" rx="8" ry="4" fill="#3b2f2f"/><ellipse cx="58" cy="132" rx="8" ry="4" fill="#3b2f2f"/>`;
  // 腕
  const armC = o.outer ? outC : (sleeveSkin ? skin : topC);
  g += `<rect x="24" y="40" width="10" height="44" rx="5" fill="${armC}"/><rect x="66" y="40" width="10" height="44" rx="5" fill="${armC}"/>`;
  if (sleeveSkin) g += `<rect x="23" y="39" width="12" height="14" rx="5" fill="${topC}"/><rect x="65" y="39" width="12" height="14" rx="5" fill="${topC}"/>`;
  // 胴体（インナー）
  g += `<path d="M32 42 Q32 36 40 36 H60 Q68 36 68 42 V84 H32 Z" fill="${topC}"/>`;
  if (o.top === 'long' && !o.outer) g += `<path d="M44 36 L50 44 L56 36" fill="none" stroke="#0002" stroke-width="1.5"/>`;
  // アウター
  if (o.outer === 'down') {
    g += `<path d="M30 44 Q30 35 40 35 H60 Q70 35 70 44 V${len} H30 Z" fill="${outC}"/>`;
    for (let y = 50; y < len; y += 10) g += `<path d="M30 ${y} H70" stroke="#0003" stroke-width="1.5"/>`;
    g += `<path d="M50 36 V${len}" stroke="#0003" stroke-width="1.5"/>`;
    g += `<rect x="22" y="40" width="13" height="44" rx="6" fill="${outC}"/><rect x="65" y="40" width="13" height="44" rx="6" fill="${outC}"/>`;
  } else if (o.outer) {
    g += `<path d="M30 44 Q30 35 40 35 H47 L46 ${len} H30 Z" fill="${outC}"/><path d="M70 44 Q70 35 60 35 H53 L54 ${len} H70 Z" fill="${outC}"/>`;
    if (o.outer !== 'cardigan') g += `<path d="M47 35 L42 50 L46 54 M53 35 L58 50 L54 54" fill="none" stroke="#0003" stroke-width="1.5"/>`;
    if (o.outer === 'trench') g += `<rect x="30" y="74" width="40" height="4" fill="#8a6a45"/>`;
    if (o.outer === 'cardigan') for (const y of [50, 60, 70]) g += `<circle cx="45" cy="${y}" r="1.3" fill="#fff9"/>`;
  }
  // 手（手袋）
  g += `<circle cx="29" cy="86" r="5" fill="${o.gloves ? '#c0392b' : skin}"/><circle cx="71" cy="86" r="5" fill="${o.gloves ? '#c0392b' : skin}"/>`;
  // 首・顔
  g += `<rect x="45" y="30" width="10" height="8" fill="${skin}"/><circle cx="50" cy="20" r="12" fill="${skin}"/>`;
  g += `<circle cx="45.5" cy="21" r="1.4" fill="#3a2a22"/><circle cx="54.5" cy="21" r="1.4" fill="#3a2a22"/><path d="M47 26 Q50 28 53 26" fill="none" stroke="#c0645a" stroke-width="1.3" stroke-linecap="round"/>`;
  g += `<circle cx="42.5" cy="24.5" r="2" fill="#ff8a8a55"/><circle cx="57.5" cy="24.5" r="2" fill="#ff8a8a55"/>`;
  // 前髪
  g += F ? `<path d="M37 20 Q38 7 50 7 Q62 7 63 20 Q56 13 48 15 Q42 16 37 20 Z" fill="${hair}"/>`
         : `<path d="M38 19 Q37 6 50 6 Q63 6 62 19 Q58 12 50 12 Q42 12 38 19 Z" fill="${hair}"/>`;
  // マフラー
  if (o.scarf) g += `<path d="M38 33 Q50 40 62 33 L62 39 Q50 45 38 39 Z" fill="#e2b33c"/><rect x="54" y="38" width="7" height="18" rx="2" fill="#e2b33c"/><path d="M54 52 H61" stroke="#c0392b" stroke-width="2"/>`;
  // 傘
  if (o.umb === 'long') g += `<path d="M78 40 V126" stroke="#2f7bd8" stroke-width="3"/><path d="M74 46 L78 40 L82 46 L80 96 H76 Z" fill="#2f7bd8"/><path d="M78 126 q0 6 -5 5" fill="none" stroke="#3b2f2f" stroke-width="3" stroke-linecap="round"/>`;
  if (o.umb === 'fold') g += `<rect x="73" y="88" width="9" height="22" rx="3" fill="#2f7bd8"/><rect x="76" y="83" width="3" height="6" fill="#3b2f2f"/><path d="M73 96 H82 M73 102 H82" stroke="#fff8" stroke-width="1"/>`;
  return `<svg viewBox="0 0 100 140" role="img" aria-label="${o.title}の服装イラスト">${g}</svg>`;
}
const umbIcon = t => `<svg viewBox="0 0 16 16"><path d="M1 8 Q8 0 15 8 Z" fill="currentColor"/><path d="M8 8 V13 q0 2 -2 1.5" fill="none" stroke="currentColor" stroke-width="1.6"/>${t === 'fold' ? '' : ''}</svg>`;
const warmBar = lv => `<span class="warm" aria-label="上着の暖かさ ${lv}/5">暖かさ ${[1,2,3,4,5].map(n => `<i class="${n <= lv ? 'on' : ''}"></i>`).join('')}</span>`;

function cardHTML(w, o, hero) {
  return `<div class="card" data-lv="${Math.round(w.max)}°" style="--lvbg:${LV[o.lv][0]}88;--lvfg:${LV[o.lv][1]}">${figure(o)}
    <div class="ot">${hero ? `<span class="big">${WX(w.code)} ${Math.round(w.temp)}°<small>いま</small></span>` : ''}
    <span class="ttl">${o.title}</span>${warmBar(o.lv)}
    <span class="desc">${o.text}</span>
    <span class="tmp">最高 <b>${Math.round(w.max)}°</b> / 最低 <b class="lo">${Math.round(w.min)}°</b>　降水 ${w.rain}%</span>
    ${o.umb ? `<span class="umb ${o.umb}">${umbIcon(o.umb)}${UMB[o.umb]}</span>` : ''}</div></div>`;
}
let heroWx = null;
function renderHero() {
  document.getElementById('hero').innerHTML = heroWx ? cardHTML(heroWx, outfit(heroWx), true) : '';
}
function renderPins() {
  renderHero();
  document.getElementById('pins').innerHTML = pins.map((p, i) => {
    const w = pinWx[i], o = w && w.max != null ? outfit(w) : null;
    return `<li><span class="nm" data-i="${i}" title="${esc(p.name)}">📍${esc(p.name)}</span>
      <span class="wx">${w ? `${WX(w.code)} ${Math.round(w.temp)}°` : '…'}</span>
      <span class="rp">${w && w.rain != null ? w.rain + '%' : ''}</span>
      <button data-del="${i}" aria-label="${esc(p.name)}を削除">×</button>
      ${o ? cardHTML(w, o) : ''}</li>`;
  }).join('');
}
// ピン留め地点の天気をまとめて取得
async function loadPinWeather() {
  pinWx = [];
  renderPins();
  if (!pins.length) return;
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + pins.map(p => p.lat.toFixed(3)).join(',') +
    '&longitude=' + pins.map(p => p.lon.toFixed(3)).join(',') +
    '&current=temperature_2m,weather_code&hourly=precipitation_probability&forecast_hours=1' +
    '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max&forecast_days=1&timezone=Asia%2FTokyo';
  try {
    let d = await getJSON(url);
    if (!Array.isArray(d)) d = [d];
    pinWx = d.map(x => ({
      temp: x.current.temperature_2m, code: x.current.weather_code,
      rain: x.daily.precipitation_probability_max[0] ?? x.hourly.precipitation_probability[0],
      max: x.daily.temperature_2m_max[0], min: x.daily.temperature_2m_min[0], wind: x.daily.wind_speed_10m_max[0] ?? 0, psum: x.daily.precipitation_sum[0] ?? 0
    }));
  } catch {}
  renderPins();
}

// 今日の服装をテキストで共有
document.getElementById('shareBtn').onclick = async () => {
  const btn = document.getElementById('shareBtn');
  const text = '今日の服装（' + (gender === 'F' ? '女性' : '男性') + '）\n' + pins.map((p, i) => {
    const w = pinWx[i]; if (!w || w.max == null) return '';
    const o = outfit(w);
    return `📍${p.name} ${WX(w.code)} ${Math.round(w.max)}°/${Math.round(w.min)}° 降水${w.rain}%\n👕 ${o.title}：${o.text}${o.umb ? '\n☂️ ' + UMB[o.umb] : ''}`;
  }).filter(Boolean).join('\n\n');
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); btn.textContent = 'コピーしました'; }
  catch { btn.textContent = 'コピーできませんでした'; }
  setTimeout(() => btn.textContent = '共有', 2000);
};
setGender(gender);

document.getElementById('pins').onclick = e => {
  const t = e.target;
  if (t.dataset.i !== undefined && pins[+t.dataset.i]) { const p = pins[+t.dataset.i]; map.setView([p.lat, p.lon], 11); setPoint(p.lat, p.lon, p.name); document.getElementById('p1').scrollTo({ top: 0, behavior: 'smooth' }); }
  if (t.dataset.del !== undefined) { pins.splice(+t.dataset.del, 1); pinWx.splice(+t.dataset.del, 1); savePins(); renderPins(); updatePinBtn(); }
};
document.getElementById('pinBtn').onclick = () => {
  if (!current) return;
  const i = pinIndex();
  if (i >= 0) pins.splice(i, 1);
  else {
    let name = current.name;
    if (name === 'タップした地点' || name === '現在地') name = `${name}（${current.lat.toFixed(2)}, ${current.lon.toFixed(2)}）`;
    pins.push({ ...current, name });
  }
  savePins(); loadPinWeather(); updatePinBtn();
};
loadPinWeather();
setInterval(loadPinWeather, 10 * 60 * 1000);

// ---- 住所検索（国土地理院）----
const results = document.getElementById('results');
document.getElementById('search').onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  results.hidden = false;
  results.innerHTML = '<li>検索中…</li>';
  try {
    const r = await (await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q))).json();
    if (!r.length) { results.innerHTML = '<li>見つかりませんでした。別の書き方で試してください。</li>'; return; }
    results.innerHTML = r.slice(0, 20).map(f =>
      `<li data-lat="${f.geometry.coordinates[1]}" data-lon="${f.geometry.coordinates[0]}">${esc(f.properties.title)}</li>`).join('');
  } catch { results.innerHTML = '<li>検索できませんでした。通信状況を確認してください。</li>'; }
};
results.onclick = e => {
  const li = e.target.closest('li[data-lat]');
  if (!li) return;
  const lat = +li.dataset.lat, lon = +li.dataset.lon;
  map.setView([lat, lon], 12);
  setPoint(lat, lon, li.textContent);
  results.hidden = true;
};
map.on('click', e => setPoint(e.latlng.lat, e.latlng.lng, 'タップした地点'));

function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    map.setView([p.coords.latitude, p.coords.longitude], 10);
    setPoint(p.coords.latitude, p.coords.longitude, '現在地');
  }, () => {});
}
document.getElementById('locate').onclick = locate;

// ---- フリックで画面切り替え ----
const pages = document.getElementById('pages'), tabs = [document.getElementById('t0'), document.getElementById('t1')], ink = document.getElementById('tabInk');
function goPage(i, smooth = true) { pages.scrollTo({ left: i * pages.clientWidth, behavior: smooth ? 'smooth' : 'auto' }); }
function syncTabs() {
  const i = Math.round(pages.scrollLeft / pages.clientWidth);
  tabs.forEach((t, j) => t.ariaSelected = j === i);
  ink.style.width = tabs[i].offsetWidth + 'px';
  ink.style.transform = `translateX(${tabs[i].offsetLeft - 3}px)`;
  try { localStorage.setItem('page', i); } catch {}
}
tabs.forEach((t, i) => t.onclick = () => goPage(i));
pages.addEventListener('scroll', () => requestAnimationFrame(syncTabs), { passive: true });
window.addEventListener('resize', () => { map.invalidateSize(); syncTabs(); });
// 地図の上は地図の操作を優先し、右端のふちからのスワイプで次の画面へ
let ex = null;
const edge = document.getElementById('edge');
edge.addEventListener('touchstart', e => ex = e.touches[0].clientX, { passive: true });
edge.addEventListener('touchend', e => { if (ex != null && ex - e.changedTouches[0].clientX > 30) goPage(1); ex = null; });
['fc', 'ctrl', 'swipeHint'].forEach(id => {
  const el = document.getElementById(id); let sx = null, sy = null;
  el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = sx - e.changedTouches[0].clientX, dy = Math.abs(sy - e.changedTouches[0].clientY);
    if (e.target.id !== 'slider' && dx > 60 && dy < 40) goPage(1); sx = null;
  });
});
document.getElementById('swipeHint').onclick = () => goPage(1);
L.DomEvent.disableScrollPropagation(document.getElementById('ctrl'));
try { if (localStorage.getItem('page') === '1') requestAnimationFrame(() => goPage(1, false)); } catch {}
requestAnimationFrame(syncTabs);

setPoint(35.68, 139.76, '東京');
locate();
// 予報の取得を先に済ませてから、レーダー（モデル予報を含む）を読み込む
setTimeout(() => loadRadar().catch(() => { document.getElementById('time').textContent = '取得失敗'; }), 1500);
// 地図を大きく動かしたらモデル予報を取り直す
let moveT;
map.on('moveend', () => {
  clearTimeout(moveT);
  moveT = setTimeout(async () => {
    if (!model || model.bounds.contains(map.getBounds())) return;
    if (Date.now() - model.at < 2 * 60e3) return; // 2分以内の取り直しはしない
    try {
      await loadModel();
      for (const k in layers) if (k.startsWith('m')) { map.removeLayer(layers[k]); delete layers[k]; }
      show(idx);
    } catch {}
  }, 800);
});
setInterval(() => { Object.values(layers).forEach(l => map.removeLayer(l)); layers = {}; loadRadar(); }, 5 * 60 * 1000);
</script>
