<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あまぐもレーダー</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f3f6f9; --panel: #ffffffee; --fg: #13202b; --muted: #5b6b78; --accent: #1f6fd1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e151b; --panel: #18222bee; --fg: #e6eef4; --muted: #93a4b1; --accent: #5aa2ff; color-scheme: dark; }
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 1000; background: var(--panel); backdrop-filter: blur(6px);
    border-radius: 12px; box-shadow: 0 4px 16px #0003; padding: 10px 14px;
  }
  #ctrl {
    left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right));
    bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  #time { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 6.5em; }
  #tag { font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--muted); color: var(--bg); }
  #tag.fc { background: #e08a00; color: #fff; }
  #slider { flex: 1; accent-color: var(--accent); }
  button {
    border: 0; border-radius: 99px; background: var(--accent); color: #fff; font-size: 1rem;
    width: 40px; height: 40px; cursor: pointer; flex: none;
  }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  #fc {
    top: calc(10px + env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
    max-width: min(360px, calc(100% - 20px)); box-sizing: border-box;
  }
  #fc h2 { margin: 0 0 6px; font-size: .9rem; color: var(--muted); font-weight: 600; }
  #hours { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .h { text-align: center; flex: none; font-variant-numeric: tabular-nums; font-size: .8rem; }
  .h b { display: block; font-size: 1.3rem; line-height: 1.4; }
  .h .p { color: var(--accent); }
  #legend { display: flex; gap: 2px; font-size: .65rem; color: var(--muted); align-items: center; }
  #legend i { width: 18px; height: 8px; display: inline-block; }
  .credit { font-size: .65rem; color: var(--muted); }
  #q { flex: 1; min-width: 0; font-size: 16px; padding: 8px 10px; border-radius: 8px;
       border: 1px solid var(--muted); background: var(--bg); color: var(--fg); }
  #results { list-style: none; margin: 0 0 8px; padding: 0; max-height: 40vh; overflow-y: auto; }
  #results li { padding: 8px 6px; border-bottom: 1px solid #8883; cursor: pointer; font-size: .9rem; }
  #results li:hover { background: #8882; }
  #pins { list-style: none; margin: 0 0 8px; padding: 0; max-height: 30vh; overflow-y: auto; border-bottom: 1px solid #8883; }
  #pins:empty { display: none; }
  #pins li { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: .85rem; font-variant-numeric: tabular-nums; }
  #pins .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  #pins .wx { flex: none; } #pins .rp { flex: none; width: 3em; text-align: right; color: var(--accent); }
  #pins button, .ghost { background: none; color: var(--muted); width: 28px; height: 28px; font-size: .9rem; }
  #pinBtn { color: #e0a800; font-size: 1.3rem; width: 32px; height: 32px; }
  #fc h2 { margin-bottom: 0; }
  #locate { position: absolute; right: max(10px, env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); z-index: 1000; }
</style>
</head>
<body>
<div id="map"></div>

<button id="locate" title="現在地へ移動" aria-label="現在地へ移動">◎</button>

<section id="fc" class="panel">
  <form id="search" class="row" style="gap:6px;margin-bottom:8px">
    <input id="q" type="search" placeholder="住所・地名で検索" aria-label="住所検索" autocomplete="off">
    <button type="submit" aria-label="検索" style="width:36px;height:36px">🔍</button>
  </form>
  <ul id="results" hidden></ul>
  <ul id="pins" aria-label="ピン留めした地点"></ul>
  <div class="row" style="justify-content:space-between">
    <h2 id="fcTitle">この場所の天気（読み込み中…）</h2>
    <button id="pinBtn" class="ghost" aria-label="この地点をピン留め" title="ピン留め">☆</button>
  </div>
  <div id="hours"></div>
</section>

<section id="ctrl" class="panel">
  <div class="row">
    <button id="play" aria-label="再生">▶</button>
    <span id="time">--:--</span>
    <span id="tag">実況</span>
  </div>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="時刻">
  <div class="row" style="justify-content:space-between;flex-wrap:wrap">
    <div id="legend">弱
      <i style="background:#f2f2ff"></i><i style="background:#a0d2ff"></i><i style="background:#218cff"></i>
      <i style="background:#0041ff"></i><i style="background:#faf500"></i><i style="background:#ff9900"></i>
      <i style="background:#ff2800"></i><i style="background:#b40068"></i>強
    </div>
    <span class="credit">雨雲: 気象庁 / 予報: Open-Meteo</span>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const JMA = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/';
const map = L.map('map', { zoomControl: false }).setView([35.68, 139.76], 8);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
}).addTo(map);

let frames = [], layers = {}, idx = 0, timer = null;
const slider = document.getElementById('slider');

function fmt(t) { // "20261122123500" (UTC) -> "21:35"
  const d = new Date(Date.UTC(+t.slice(0,4), +t.slice(4,6)-1, +t.slice(6,8), +t.slice(8,10), +t.slice(10,12)));
  return d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo' });
}

function layerFor(f) {
  const key = f.basetime + f.validtime;
  if (!layers[key]) {
    layers[key] = L.tileLayer(`${JMA}${f.basetime}/none/${f.validtime}/surf/hrpns/{z}/{x}/{y}.png`, {
      opacity: 0, maxNativeZoom: 10, minNativeZoom: 4, maxZoom: 18,
      attribution: '<a href="https://www.jma.go.jp/bosai/nowc/" target="_blank">気象庁</a>'
    }).addTo(map);
  }
  return layers[key];
}

function show(i) {
  idx = i; slider.value = i;
  const f = frames[i];
  frames.forEach((g, j) => { const l = layers[g.basetime + g.validtime]; if (l) l.setOpacity(j === i ? 0.75 : 0); });
  layerFor(f).setOpacity(0.75);
  // 次のフレームを先読み
  if (frames[i + 1]) layerFor(frames[i + 1]);
  document.getElementById('time').textContent = fmt(f.validtime);
  const tag = document.getElementById('tag');
  tag.textContent = f.fc ? '予測' : '実況';
  tag.classList.toggle('fc', f.fc);
}

async function loadRadar() {
  const [n1, n2] = await Promise.all(['N1', 'N2'].map(n =>
    fetch(`${JMA}targetTimes_${n}.json`).then(r => r.json())));
  const past = n1.filter(f => f.elements.includes('hrpns'))
    .sort((a, b) => a.validtime.localeCompare(b.validtime)).slice(-12); // 直近1時間
  const fut = n2.filter(f => f.elements.includes('hrpns'))
    .sort((a, b) => a.validtime.localeCompare(b.validtime)).map(f => ({ ...f, fc: true }));
  frames = [...past, ...fut];
  slider.max = frames.length - 1;
  show(past.length - 1); // 現在
}

function togglePlay() {
  const btn = document.getElementById('play');
  if (timer) { clearInterval(timer); timer = null; btn.textContent = '▶'; btn.ariaLabel = '再生'; return; }
  btn.textContent = '❚❚'; btn.ariaLabel = '停止';
  timer = setInterval(() => show((idx + 1) % frames.length), 600);
}
document.getElementById('play').onclick = togglePlay;
slider.oninput = () => show(+slider.value);

// ---- 地点の予報 (Open-Meteo) ----
const WX = c => c === 0 ? '☀️' : c <= 2 ? '🌤' : c === 3 ? '☁️' : c <= 48 ? '🌫' :
  c <= 67 || (c >= 80 && c <= 82) ? '🌧' : c <= 77 || c === 85 || c === 86 ? '🌨' : '⛈';

async function loadForecast(lat, lon, name) {
  document.getElementById('fcTitle').textContent = `${name}の天気`;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}` +
    `&hourly=temperature_2m,precipitation_probability,weather_code&timezone=Asia%2FTokyo&forecast_hours=24`;
  try {
    const d = (await (await fetch(url)).json()).hourly;
    document.getElementById('hours').innerHTML = d.time.map((t, i) => `
      <div class="h">${+t.slice(11, 13)}時<b>${WX(d.weather_code[i])}</b>
      ${Math.round(d.temperature_2m[i])}°<br><span class="p">${d.precipitation_probability[i] ?? '-'}%</span></div>`).join('');
  } catch { document.getElementById('hours').textContent = '予報を取得できませんでした'; }
}

let marker, current = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function setPoint(lat, lon, name) {
  current = { lat, lon, name };
  if (marker) marker.setLatLng([lat, lon]); else marker = L.marker([lat, lon]).addTo(map);
  loadForecast(lat, lon, name);
  updatePinBtn();
}

// ---- ピン留め（この端末のブラウザに保存）----
let pins = [];
try { pins = JSON.parse(localStorage.getItem('pins') || '[]'); } catch {}
const savePins = () => { try { localStorage.setItem('pins', JSON.stringify(pins)); } catch {} };
const pinIndex = () => current ? pins.findIndex(p => Math.abs(p.lat - current.lat) < 1e-4 && Math.abs(p.lon - current.lon) < 1e-4) : -1;

function updatePinBtn() {
  const on = pinIndex() >= 0, b = document.getElementById('pinBtn');
  b.textContent = on ? '★' : '☆';
  b.ariaLabel = b.title = on ? 'ピン留めを外す' : 'この地点をピン留め';
}
let pinWx = [];
function renderPins() {
  document.getElementById('pins').innerHTML = pins.map((p, i) => {
    const w = pinWx[i];
    return `<li><span class="nm" data-i="${i}" title="${esc(p.name)}">📍${esc(p.name)}</span>
      <span class="wx">${w ? `${WX(w.code)} ${Math.round(w.temp)}°` : '…'}</span>
      <span class="rp">${w && w.rain != null ? w.rain + '%' : ''}</span>
      <button data-del="${i}" aria-label="${esc(p.name)}を削除">×</button></li>`;
  }).join('');
}
// ピン留め地点の天気をまとめて取得
async function loadPinWeather() {
  pinWx = [];
  renderPins();
  if (!pins.length) return;
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + pins.map(p => p.lat.toFixed(3)).join(',') +
    '&longitude=' + pins.map(p => p.lon.toFixed(3)).join(',') +
    '&current=temperature_2m,weather_code&hourly=precipitation_probability&forecast_hours=1&timezone=Asia%2FTokyo';
  try {
    let d = await (await fetch(url)).json();
    if (!Array.isArray(d)) d = [d];
    pinWx = d.map(x => ({ temp: x.current.temperature_2m, code: x.current.weather_code, rain: x.hourly.precipitation_probability[0] }));
  } catch {}
  renderPins();
}
document.getElementById('pins').onclick = e => {
  const t = e.target;
  if (t.dataset.i !== undefined && pins[+t.dataset.i]) { const p = pins[+t.dataset.i]; map.setView([p.lat, p.lon], 11); setPoint(p.lat, p.lon, p.name); }
  if (t.dataset.del !== undefined) { pins.splice(+t.dataset.del, 1); pinWx.splice(+t.dataset.del, 1); savePins(); renderPins(); updatePinBtn(); }
};
document.getElementById('pinBtn').onclick = () => {
  if (!current) return;
  const i = pinIndex();
  if (i >= 0) pins.splice(i, 1);
  else {
    let name = current.name;
    if (name === 'タップした地点' || name === '現在地') name = `${name}（${current.lat.toFixed(2)}, ${current.lon.toFixed(2)}）`;
    pins.push({ ...current, name });
  }
  savePins(); loadPinWeather(); updatePinBtn();
};
loadPinWeather();
setInterval(loadPinWeather, 10 * 60 * 1000);

// ---- 住所検索（国土地理院）----
const results = document.getElementById('results');
document.getElementById('search').onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  results.hidden = false;
  results.innerHTML = '<li>検索中…</li>';
  try {
    const r = await (await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q))).json();
    if (!r.length) { results.innerHTML = '<li>見つかりませんでした。別の書き方で試してください。</li>'; return; }
    results.innerHTML = r.slice(0, 20).map(f =>
      `<li data-lat="${f.geometry.coordinates[1]}" data-lon="${f.geometry.coordinates[0]}">${esc(f.properties.title)}</li>`).join('');
  } catch { results.innerHTML = '<li>検索できませんでした。通信状況を確認してください。</li>'; }
};
results.onclick = e => {
  const li = e.target.closest('li[data-lat]');
  if (!li) return;
  const lat = +li.dataset.lat, lon = +li.dataset.lon;
  map.setView([lat, lon], 12);
  setPoint(lat, lon, li.textContent);
  results.hidden = true;
};
map.on('click', e => setPoint(e.latlng.lat, e.latlng.lng, 'タップした地点'));

function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    map.setView([p.coords.latitude, p.coords.longitude], 10);
    setPoint(p.coords.latitude, p.coords.longitude, '現在地');
  }, () => {});
}
document.getElementById('locate').onclick = locate;

setPoint(35.68, 139.76, '東京');
locate();
loadRadar().catch(() => { document.getElementById('time').textContent = '取得失敗'; });
setInterval(() => { Object.values(layers).forEach(l => map.removeLayer(l)); layers = {}; loadRadar(); }, 5 * 60 * 1000);
</script>
</body>
</html>
