<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI/UX デザインチェッカー</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d1f23; --muted:#5f6670; --line:#e1e4e8; --accent:#2f6fed;
          --high:#d93025; --medium:#e37400; --low:#1e8e3e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#eceef1; --muted:#9aa2ad; --line:#30343b; --accent:#7aa5ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; padding:12px; border:1px solid var(--line); background:transparent; color:var(--text); border-radius:8px; font-size:1rem; cursor:pointer; min-height:44px; }
  .tabs button[aria-selected=true] { background: var(--accent); color:#fff; border-color: var(--accent); }
  label { display:block; font-weight:600; margin: 12px 0 6px; }
  input[type=url], textarea, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:1rem; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding: 32px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color: var(--accent); }
  .drop img { max-width:100%; max-height:240px; display:block; margin: 0 auto 8px; }
  .guides { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:8px; }
  .guides label { font-weight: normal; display:flex; gap:8px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:10px; margin:0; cursor:pointer; }
  .run { width:100%; margin-top:20px; padding:14px; font-size:1.05rem; font-weight:700; background:var(--accent); color:#fff; border:0; border-radius:10px; cursor:pointer; min-height:48px; }
  .run:disabled { opacity:.6; cursor:wait; }
  .error { color: var(--high); }
  .result { display:grid; grid-template-columns: 340px 1fr; gap:20px; }
  @media (max-width: 800px) { .result { grid-template-columns: 1fr; } }
  .shot { max-height: 80vh; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .shot img { width:100%; display:block; }
  .score { font-size: 2.6rem; font-weight: 800; }
  .issue { border-left: 4px solid var(--line); padding: 8px 12px; margin: 12px 0; background: var(--bg); border-radius: 0 8px 8px 0; }
  .issue.high { border-color: var(--high); } .issue.medium { border-color: var(--medium); } .issue.low { border-color: var(--low); }
  .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; color:#fff; margin-right:6px; }
  .badge.high { background: var(--high); } .badge.medium { background: var(--medium); } .badge.low { background: var(--low); }
  .meta { color: var(--muted); font-size: .85rem; }
  .issue p { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>UI/UX デザインチェッカー</h1>
  <p class="lead">スクリーンショットやURLを、Apple HIG・Material Design などのガイドラインに沿ってAIがレビューします。</p>

  <form class="card" id="form">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-mode="image">画像をアップロード</button>
      <button type="button" role="tab" aria-selected="false" data-mode="url">URLを入力</button>
    </div>

    <div id="mode-image">
      <div class="drop" id="drop" tabindex="0">クリック or ドラッグ＆ドロップで画像を選択（PNG / JPEG / WebP）</div>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    </div>
    <div id="mode-url" hidden>
      <label for="url">URL</label>
      <input type="url" id="url" placeholder="https://example.com">
      <label for="device">表示サイズ</label>
      <select id="device"><option value="mobile">モバイル（390px）</option><option value="desktop">デスクトップ（1440px）</option></select>
    </div>

    <label>参照するガイドライン</label>
    <div class="guides" id="guides"></div>

    <label for="context">補足（任意）：対象ユーザー・画面の目的など</label>
    <textarea id="context" rows="2" placeholder="例：20〜60代向けの決済アプリのホーム画面"></textarea>

    <button class="run" id="run">チェックする</button>
    <p class="error" id="error" role="alert"></p>
  </form>

  <section class="card" id="result" hidden></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let mode = 'image', file = null;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

fetch('/api/guidelines').then(r => r.json()).then(({ defaults, items }) => {
  $('guides').innerHTML = items.map(g => `
    <label><input type="checkbox" value="${g.id}" ${defaults.includes(g.id) ? 'checked' : ''}>
      <span>${esc(g.name)}${g.note ? '<br><span class="meta">※公式ガイドラインではなく傾向ベース</span>' : ''}</span></label>`).join('');
});

document.querySelectorAll('[role=tab]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('[role=tab]').forEach(x => x.setAttribute('aria-selected', x === b));
  $('mode-image').hidden = mode !== 'image';
  $('mode-url').hidden = mode !== 'url';
});

const drop = $('drop');
const setFile = (f) => {
  if (!f) return;
  file = f;
  drop.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="選択した画像">${esc(f.name)}`;
};
drop.onclick = () => $('file').click();
drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') $('file').click(); };
$('file').onchange = (e) => setFile(e.target.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); setFile(e.dataTransfer.files[0]); };
document.addEventListener('paste', (e) => { const f = [...e.clipboardData.files][0]; if (f) setFile(f); });

$('form').onsubmit = async (e) => {
  e.preventDefault();
  $('error').textContent = '';
  const fd = new FormData();
  const keys = [...document.querySelectorAll('#guides input:checked')].map(i => i.value);
  if (!keys.length) return $('error').textContent = 'ガイドラインを1つ以上選んでください';
  fd.append('guidelines', keys.join(','));
  fd.append('context', $('context').value);
  if (mode === 'image') {
    if (!file) return $('error').textContent = '画像を選択してください';
    fd.append('image', file);
  } else {
    if (!$('url').value) return $('error').textContent = 'URLを入力してください';
    fd.append('url', $('url').value);
    fd.append('device', $('device').value);
  }
  $('run').disabled = true; $('run').textContent = '分析中…（30秒〜1分ほどかかります）';
  try {
    const res = await fetch('/api/check', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    render(data);
  } catch (err) {
    $('error').textContent = err.message;
  } finally {
    $('run').disabled = false; $('run').textContent = 'チェックする';
  }
};

function render({ result: r, screenshot }) {
  const order = { high: 0, medium: 1, low: 2 };
  const label = { high: '重要', medium: '中', low: '軽微' };
  const issues = (r.issues || []).sort((a, b) => order[a.severity] - order[b.severity]);
  $('result').hidden = false;
  $('result').innerHTML = `
    <div class="result">
      <div class="shot"><img src="${screenshot}" alt="レビュー対象の画面"></div>
      <div>
        <div class="meta">総合スコア</div>
        <div class="score">${esc(r.score)}<span class="meta"> / 100</span></div>
        <p>${esc(r.summary)}</p>
        <h3>良い点</h3>
        <ul>${(r.good_points || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul>
        <h3>改善点（${issues.length}件）</h3>
        ${issues.map(i => `
          <div class="issue ${esc(i.severity)}">
            <strong><span class="badge ${esc(i.severity)}">${label[i.severity] || esc(i.severity)}</span>${esc(i.title)}</strong>
            <p class="meta">📍 ${esc(i.location)} ／ 根拠: ${esc(i.guideline)} — ${esc(i.rule)}</p>
            <p><b>問題:</b> ${esc(i.problem)}</p>
            <p><b>改善案:</b> ${esc(i.suggestion)}</p>
          </div>`).join('')}
      </div>
    </div>`;
  $('result').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
