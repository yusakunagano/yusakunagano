<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>株ナビ</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1a1d23; --sub:#667; --up:#0a8a4a; --down:#d0342c; --accent:#2457d6; --line:#e3e6ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1e24; --fg:#e8eaed; --sub:#99a; --line:#2a2f37; --accent:#6d95ff; } }
  * { box-sizing:border-box } body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  h1 { margin:0; font-size:20px } h2 { font-size:16px; margin:24px 16px 8px; }
  .badge { font-size:12px; padding:4px 8px; border-radius:99px; background:var(--line); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .name { font-size:13px; color:var(--sub) } .price { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .up { color:var(--up) } .down { color:var(--down) }
  .sig { display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:6px; margin-top:6px; }
  .sig.注目 { background:#e3f5ea; color:var(--up) } .sig.過熱注意 { background:#fde8e6; color:var(--down) } .sig.様子見 { background:var(--line) }
  ul.r { margin:6px 0 0; padding-left:18px; font-size:12px; color:var(--sub) }
  svg { width:100%; height:48px; margin-top:6px }
  button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border:none }
  table { width:calc(100% - 32px); margin:0 16px; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:14px; }
  td,th { padding:8px 10px; border-bottom:1px solid var(--line); text-align:right } td:first-child,th:first-child { text-align:left }
  form.add { display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap } input { font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  dialog { border:none; border-radius:12px; background:var(--card); color:var(--fg); max-width:360px; width:calc(100% - 32px); }
  .note { font-size:12px; color:var(--sub); padding:16px; line-height:1.6 }
</style>
</head>
<body>
<header><h1>株ナビ</h1><span id="mode" class="badge">接続確認中…</span></header>

<h2>マーケット</h2><div id="market" class="grid"></div>

<h2>ウォッチリスト</h2>
<form class="add" id="addForm"><input name="symbol" placeholder="銘柄コード (例: 6501.T)" required><input name="name" placeholder="名前 (任意)"><button>追加</button></form>
<div id="watch" class="grid"></div>

<h2>保有資産</h2><div id="portfolio"></div>

<dialog id="dlg"><form method="dialog" id="orderForm">
  <h3 id="dlgTitle" style="margin-top:0"></h3>
  <p><label>数量 <input name="qty" type="number" min="1" value="100" required></label></p>
  <p><label>指値 (空欄で成行) <input name="price" type="number" step="0.1"></label></p>
  <p class="name">注文内容をよく確認してください。投資判断はご自身の責任で行ってください。</p>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button value="cancel" formnovalidate>キャンセル</button><button class="primary" value="ok">注文を確定</button></div>
</form></dialog>

<p class="note">※ 表示されるシグナルは移動平均・RSI による機械的な目安で、売買を推奨するものではありません。株価データは遅延・欠損することがあります。</p>

<script>
const $ = (s) => document.querySelector(s);
const yen = (n) => n?.toLocaleString("ja-JP", { maximumFractionDigits: 1 });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
let orderTarget = null;

function spark(points) {
  const c = points.map((p) => p.c), min = Math.min(...c), max = Math.max(...c);
  const d = c.map((v, i) => `${(i / (c.length - 1)) * 100},${40 - ((v - min) / (max - min || 1)) * 36}`).join(" ");
  const cls = c.at(-1) >= c[0] ? "up" : "down";
  return `<svg viewBox="0 0 100 42" preserveAspectRatio="none"><polyline points="${d}" fill="none" stroke="currentColor" class="${cls}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function card(x, tradable) {
  const cls = x.change >= 0 ? "up" : "down";
  return `<div class="card">
    <div class="name">${esc(x.name)} · ${esc(x.symbol)}${x.demo ? " (ダミー)" : ""}</div>
    <div class="price">${yen(x.last)} <small class="${cls}">${x.change >= 0 ? "+" : ""}${x.change.toFixed(2)}%</small></div>
    ${spark(x.points)}
    <span class="sig ${x.signal}">${x.signal}</span>
    <ul class="r">${x.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
    ${tradable ? `<div style="display:flex;gap:6px;margin-top:10px">
      <button class="primary" data-act="buy" data-sym="${esc(x.symbol)}" data-name="${esc(x.name)}">買う</button>
      <button data-act="sell" data-sym="${esc(x.symbol)}" data-name="${esc(x.name)}">売る</button>
      <button data-act="del" data-sym="${esc(x.symbol)}" style="margin-left:auto">削除</button></div>` : ""}
  </div>`;
}

async function api(path, opts) {
  const r = await fetch(path, opts && { method: opts.method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(opts.body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error); return j;
}

async function load() {
  const st = await api("/api/status");
  $("#mode").textContent = st.demo ? "デモモード (MCP 未接続)" : "証券会社 MCP 接続中";
  const [m, w, p] = await Promise.all([api("/api/market"), api("/api/watchlist"), api("/api/portfolio")]);
  $("#market").innerHTML = m.map((x) => card(x, false)).join("");
  // 「注目」シグナルの銘柄を先頭に
  const order = { 注目: 0, 様子見: 1, 過熱注意: 2 };
  $("#watch").innerHTML = w.sort((a, b) => order[a.signal] - order[b.signal]).map((x) => card(x, true)).join("");
  const rows = (p.positions || []).map((x) => `<tr><td>${esc(x.name || x.symbol)}</td><td>${yen(x.qty)}</td><td>${yen(x.avgPrice)}</td></tr>`).join("");
  $("#portfolio").innerHTML = `<table><tr><th>銘柄</th><th>数量</th><th>取得単価</th></tr>${rows}
    <tr><td>現金</td><td colspan="2">${yen(p.cash)} 円</td></tr></table>`;
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  if (b.dataset.act === "del") { await api(`/api/watchlist/${encodeURIComponent(b.dataset.sym)}`, { method: "DELETE" }); return load(); }
  orderTarget = { symbol: b.dataset.sym, side: b.dataset.act };
  $("#dlgTitle").textContent = `${b.dataset.name} を${b.dataset.act === "buy" ? "買う" : "売る"}`;
  $("#dlg").showModal();
});

$("#dlg").addEventListener("close", async () => {
  if ($("#dlg").returnValue !== "ok") return;
  const f = new FormData($("#orderForm"));
  try {
    const r = await api("/api/order", { method: "POST", body: { ...orderTarget, qty: Number(f.get("qty")), price: f.get("price") || undefined, confirmed: true } });
    alert(r.message || "注文を送信しました");
    load();
  } catch (err) { alert("注文エラー: " + err.message); }
});

$("#addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  await api("/api/watchlist", { method: "POST", body: Object.fromEntries(f) });
  e.target.reset(); load();
});

load(); setInterval(load, 60_000);
</script>
</body>
</html>
