<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>テニスゲーム</title>
<style>
  html,body{margin:0;height:100%;background:#1d3b2a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
  #wrap{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center}
  canvas{display:block}
  #hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:8px;font-size:15px;white-space:nowrap;text-align:center}
  #msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:bold;text-shadow:0 2px 6px #000;pointer-events:none;text-align:center}
  .menu{position:absolute;inset:0;background:rgba(10,30,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  .menu h1{margin:0 0 8px;font-size:34px}
  .menu h2{margin:8px 0 0;font-size:18px;font-weight:normal;opacity:.85}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font-size:18px;padding:12px 22px;border:none;border-radius:10px;background:#f2d43d;color:#222;font-weight:bold;cursor:pointer}
  button.sel{outline:4px solid #fff}
  button.sub{background:#cfd8d3}
  .help{font-size:14px;opacity:.85;max-width:420px;text-align:center;line-height:1.6}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="msg"></div>
  <div class="menu" id="menu">
    <h1>🎾 テニス</h1>
    <h2>モードを選択</h2>
    <div class="row">
      <button data-mode="singles" class="sel">シングルス</button>
      <button data-mode="doubles">ダブルス</button>
    </div>
    <div id="posBox" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <h2>ポジション（ダブルス）</h2>
      <div class="row">
        <button data-pos="back" class="sel">後衛（ベースライン）</button>
        <button data-pos="front">前衛（ネット）</button>
      </div>
    </div>
    <h2>強さ</h2>
    <div class="row">
      <button data-lv="0" class="sub">やさしい</button>
      <button data-lv="1" class="sub sel">ふつう</button>
      <button data-lv="2" class="sub">つよい</button>
    </div>
    <button id="start" style="margin-top:10px;font-size:22px">試合開始</button>
    <div class="help">
      移動：矢印キー / WASD（スマホは画面をドラッグ）<br>
      ボールに近づくと自動で打ちます。打つ瞬間の ←→ でコースを狙えます。<br>
      打つ瞬間に ↑（前）を押すと強打（速いがブレる）。ボールに近すぎると詰まってミスしやすい。<br>
      ボールを体の少し右か左でとらえると力が伝わる（正面だと弱い球）。<br>
      Shift を押しながら打つとロブ。<br>
      サーブ：スペース（スマホはタップ）<br>
      1セットマッチ（6ゲーム先取・2ゲーム差）
    </div>
  </div>
</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), msgEl = document.getElementById('msg');
const menu = document.getElementById('menu');

// ---- court constants (meters) ----
const HL = 11.885, DW = 5.485, SW = 4.115, SL = 6.4, NET_H = 0.914, G = 9.8;
const VIEW_W = 16;
// ---- 透視投影カメラ（手前ベースライン後方・高い位置から見る） ----
const CAMY = HL + 9, CAMZ = 10, PITCH = 0.42, PC = Math.cos(PITCH), PS = Math.sin(PITCH);
let F = 100, CX = 0, HY = 0, curF = 10;
function cam(y, z){ const dy = CAMY - y, dz = z - CAMZ; return [Math.max(0.5, dy * PC - dz * PS), dy * PS + dz * PC]; }
function resize(){
  const dpr = devicePixelRatio, w = innerWidth, h = innerHeight;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const W = cv.width, H = cv.height;
  const [dn] = cam(HL + 2, 0);
  const F1 = W * dn / (W < H ? 12.6 : 14.5);
  const [d1, u1] = cam(-HL - 3, 2.6), [d2, u2] = cam(HL + 3, 0);
  const top = -u1 / d1, bot = -u2 / d2; // F=1 のときの画面y
  const F2 = H * 0.84 / (bot - top);
  F = Math.min(F1, F2); CX = W / 2;
  HY = H * 0.55 - F * (top + bot) / 2;
}
addEventListener('resize', resize); resize();
function P(x, y, z = 0){ const [d, u] = cam(y, z), f = F / d; return [CX + x * f, HY - u * f, f]; }
const S = v => v * curF;
function inv(X, Y){ const k = (HY - Y) / F; const den = PS - k * PC; if (den <= 0.01) return { x: 0, y: -HL - 5 }; const dy = CAMZ * (PC + k * PS) / den; const d = dy * PC + CAMZ * PS; return { x: (X - CX) * d / F, y: CAMY - dy }; }

// ---- settings ----
let mode = 'singles', pos = 'back', level = 1;
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; sel('[data-mode]', b);
  document.getElementById('posBox').classList.toggle('hidden', mode !== 'doubles');
});
document.querySelectorAll('[data-pos]').forEach(b => b.onclick = () => { pos = b.dataset.pos; sel('[data-pos]', b); });
document.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { level = +b.dataset.lv; sel('[data-lv]', b); });
function sel(q, b){ document.querySelectorAll(q).forEach(x => x.classList.remove('sel')); b.classList.add('sel'); }
document.getElementById('start').onclick = startMatch;

// ---- input ----
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') { e.preventDefault(); serveRequest = true; } });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let touch = null, serveRequest = false;
function toCourt(t){ const r = cv.getBoundingClientRect(); return inv((t.clientX - r.left) * devicePixelRatio, (t.clientY - r.top) * devicePixelRatio); }
cv.addEventListener('touchstart', e => { touch = toCourt(e.touches[0]); serveRequest = true; e.preventDefault(); }, { passive: false });
cv.addEventListener('touchmove', e => { touch = toCourt(e.touches[0]); e.preventDefault(); }, { passive: false });
cv.addEventListener('touchend', () => { touch = null; });
cv.addEventListener('mousedown', () => { serveRequest = true; });

// ---- game state ----
// team 0 = player side (bottom, y>0), team 1 = CPU (top, y<0)
let players = [], ball, state = 'menu', timer = 0;
let score, server, serveSide, faults, lastHitter, bounces, isServe, rallyHits, human;
const SPEED = [4.0, 4.6, 5.2];

function mkPlayer(team, role, isHuman, color){
  return { team, role, isHuman, color, x: 0, y: 0, hx: 0, hy: 0, cool: 0, swing: 0 };
}
function startMatch(){
  menu.classList.add('hidden');
  players = [];
  if (mode === 'singles') {
    players.push(human = mkPlayer(0, 'back', true, '#2f7cf6'));
    players.push(mkPlayer(1, 'back', false, '#e5483b'));
  } else {
    players.push(human = mkPlayer(0, pos, true, '#2f7cf6'));
    players.push(mkPlayer(0, pos === 'back' ? 'front' : 'back', false, '#7fb2ff'));
    players.push(mkPlayer(1, 'back', false, '#e5483b'));
    players.push(mkPlayer(1, 'front', false, '#ff9a8f'));
  }
  score = { pts: [0, 0], games: [0, 0] };
  server = 0; faults = 0;
  newPoint();
}
function sideSign(team){ return team === 0 ? 1 : -1; }
function servingPlayer(){ return players.find(p => p.team === server && p.role === 'back'); }

function newPoint(){
  const totalPts = score.pts[0] + score.pts[1];
  serveSide = totalPts % 2 === 0 ? 1 : -1; // 1 = deuce side (right from server's view)
  for (const p of players) {
    const s = sideSign(p.team);
    // x from each player's perspective: right side = +x for team0, -x for team1
    if (p.role === 'back') { p.x = s * serveSide * 1.5 * (p.team === server ? 1 : 2.2); p.y = s * (HL + (p.team === server ? 0.4 : 0.6)); }
    else { p.x = -s * serveSide * 2.5; p.y = s * 3.5; }
    p.hx = p.x; p.hy = p.y; p.cool = 0;
  }
  if (mode === 'singles') {
    const r = players.find(p => p.team !== server);
    r.x = sideSign(r.team) * serveSide * 2.5;
  }
  const sp = servingPlayer();
  ball = { x: sp.x, y: sp.y, z: 1.0, vx: 0, vy: 0, vz: 0, live: false };
  bounces = 0; isServe = true; lastHitter = null; rallyHits = 0;
  state = 'serve'; timer = 0;
  showMsg(server === 0 && sp.isHuman ? 'スペース / タップでサーブ' : '', 0);
}

let msgTimer = 0;
function showMsg(t, dur){ msgEl.textContent = t; msgTimer = dur; }

// ---- hitting ----
function launch(fromX, fromY, fromZ, tx, ty, t){
  // ensure ball clears the net
  for (let i = 0; i < 25; i++) {
    const vx = (tx - fromX) / t, vy = (ty - fromY) / t, vz = (0.0 - fromZ + 0.5 * G * t * t) / t;
    const tn = -fromY / vy;
    const zn = fromZ + vz * tn - 0.5 * G * tn * tn;
    if (tn <= 0 || tn >= t || zn > NET_H + 0.35) return { vx, vy, vz };
    t *= 1.07;
  }
  const vx = (tx - fromX) / t, vy = (ty - fromY) / t, vz = (0.0 - fromZ + 0.5 * G * t * t) / t;
  return { vx, vy, vz };
}
function hit(p){
  const s = sideSign(p.team); // opponent court is y with sign -s
  let tx, ty, t, lob = false, power = false;
  const contact = Math.hypot(ball.x - p.x, ball.y - p.y);
  let jam = Math.max(0, (0.6 - contact) / 0.6); // 近すぎて詰まった度合い
  const vsSmash = !!ball.smash;
  const isSmash = ball.z > 2.0;
  const isVolley = !isSmash && bounces === 0 && Math.abs(p.y) < 8;
  const side = (ball.x - p.x) * s >= 0 ? 'f' : 'b';
  p.shot = isSmash ? 'sm' : side + (isVolley ? 'v' : 's');
  const err = [1.6, 1.1, 0.7][level];
  if (p.isHuman) {
    let aim = 0;
    if (keys['arrowleft'] || keys['a']) aim -= 1;
    if (keys['arrowright'] || keys['d']) aim += 1;
    if (touch) aim = Math.max(-1, Math.min(1, (touch.x - p.x) / 2));
    if (aim === 0) aim = (ball.x - p.x) * 0.8; // natural angle from contact point
    const W = mode === 'doubles' ? DW : SW;
    tx = Math.max(-W + 0.4, Math.min(W - 0.4, aim * (W - 0.8) + (Math.random() - .5) * 0.6));
    ty = -s * (HL - 1.6 - Math.random() * 2.5);
    lob = keys['shift'];
    power = !lob && (keys['arrowup'] || keys['w']);
    if (power) { tx += (Math.random() - .5) * 1.6; ty -= s * (Math.random() - .3) * 2.2; }
  } else {
    const W = mode === 'doubles' ? DW : SW;
    // aim away from opponents
    const opps = players.filter(o => o.team !== p.team);
    let best = 0, bestScore = -1;
    for (let k = 0; k < 7; k++) {
      const cx = -W + 0.7 + (2 * W - 1.4) * k / 6;
      const d = Math.min(...opps.map(o => Math.abs(o.x - cx)));
      if (d > bestScore) { bestScore = d; best = cx; }
    }
    tx = best * [0.5, 0.75, 0.9][level] + (Math.random() - .5) * err * 2;
    ty = -s * (HL - 1.5 - Math.random() * 4);
    if (p.role === 'front' && Math.abs(p.y) < 5) ty = -s * (4 + Math.random() * 5); // volley angle
    lob = Math.random() < 0.08 && opps.some(o => o.role === 'front' && Math.abs(o.y) < 5);
    // small chance of error
    if (Math.random() < [0.16, 0.09, 0.04][level]) { tx *= 1.35; ty *= 1.12; }
  }
  if (isSmash) {
    // スマッシュ：高い打点から叩きつける
    const W = mode === 'doubles' ? DW : SW;
    const opps = players.filter(o => o.team !== p.team);
    tx = (Math.random() - .5) * 2 * (W - 0.8);
    if (!p.isHuman) { const o = opps[0]; tx = o.x > 0 ? -(1 + Math.random() * (W - 1.6)) : 1 + Math.random() * (W - 1.6); }
    else if (keys['arrowleft'] || keys['a']) tx = -(W - 1); else if (keys['arrowright'] || keys['d']) tx = W - 1;
    ty = -s * (SL - 1.5 + Math.random() * 4.5);
    lob = false; power = false;
    if (Math.random() < (p.isHuman ? 0.06 : [0.18, 0.1, 0.05][level])) ty *= 1.5;
  }
  let mishit = false, netMiss = false;
  // ボレー：近くから打たれると反応が間に合わずミスしやすい
  let rush = 0;
  if (bounces === 0 && Math.abs(p.y) < 6.5 && hitFrom) {
    const react = Math.hypot(p.x - hitFrom.x, p.y - hitFrom.y) / Math.max(1, Math.hypot(ball.vx, ball.vy));
    rush = Math.max(0, Math.min(1, (0.75 - react) / 0.45));
  }
  if (isSmash) rush = 0;
  if ((jam > 0 && Math.random() < 0.25 + jam * 0.6) || (rush > 0 && Math.random() < rush * 0.75) || (vsSmash && Math.random() < 0.7)) {
    if (vsSmash) jam = Math.max(jam, 0.9);
    mishit = true; jam = Math.max(jam, rush * 0.8);
    tx += (Math.random() - .5) * 6 * jam + (Math.random() - .5) * 2;
    ty *= 0.45 + Math.random() * 0.95;
    netMiss = Math.random() < 0.35;
  }
  const dist = Math.hypot(tx - ball.x, ty - ball.y);
  let spd = lob ? 11 : (p.isHuman ? (power ? 40 : 22) : [17, 20, 24][level]);
  if (mishit) spd *= 0.6;
  // 体の正面より少し横（0.55〜1.2m）で打つと力が伝わる。正面だと弱い球になる
  const lat = Math.abs(ball.x - p.x);
  let pf = lat < 0.3 ? 0.55 : lat < 0.55 ? 0.55 + (lat - 0.3) / 0.25 * 0.45 : 1.0;
  if (lat >= 0.55 && lat <= 1.2) pf = 1.08;
  if (!lob && !isSmash) spd *= pf;
  const weak = pf < 0.8 && !isSmash;
  if (isSmash) spd = (p.isHuman ? 40 : [32, 36, 40][level]) * (mishit ? 0.6 : 1);
  t = dist / spd;
  if (lob) t = Math.max(t, 1.7);
  const z = Math.max(ball.z, 0.4);
  const v = launch(ball.x, ball.y, z, tx, ty, t);
  Object.assign(ball, v); ball.z = z;
  if (netMiss) ball.vz *= 0.35;
  ball.smash = isSmash && !mishit;
  p.tag = mishit ? '詰まった！' : weak ? '正面…' : power ? '強打！' : '';
  lastHitter = p; bounces = 0; isServe = false; rallyHits++;
  hitFrom = { x: ball.x, y: ball.y };
  p.swing = 0.25; p.st = 0; p.prep = 0; p.serveSwing = false;
  p.label = 0.9;
  for (const q of players) q.cool = 0;
  p.cool = 0.4;
}
function serve(p){
  const s = sideSign(p.team);
  // target: diagonal service box on opponent side
  const boxX = -s * serveSide; // opposite side across
  const W = SW;
  let tx = boxX * (0.6 + Math.random() * (W - 1.2));
  let ty = -s * (SL - 0.7 - Math.random() * 2.2);
  if (!p.isHuman && Math.random() < [0.3, 0.2, 0.12][level]) ty -= s * 1.0; // fault chance
  if (p.isHuman) {
    if (keys['arrowleft'] || keys['a']) tx = boxX > 0 ? 0.5 : -W + 0.5;
    if (keys['arrowright'] || keys['d']) tx = boxX > 0 ? W - 0.5 : -0.5;
    if (Math.random() < 0.12) ty -= s * 0.9;
  }
  ball.z = Math.max(ball.z, 2.4);
  const dist = Math.hypot(tx - ball.x, ty - ball.y);
  Object.assign(ball, launch(ball.x, ball.y, ball.z, tx, ty, dist / 26));
  ball.live = true; lastHitter = p; hitFrom = { x: p.x, y: p.y }; bounces = 0; isServe = true;
  p.swing = 0.3; p.cool = 0.5; p.shot = 'sm'; p.st = 0; p.prep = 0; ball.smash = false; p.serveSwing = true;
  state = 'rally'; showMsg('', 0);
}

// ---- point resolution ----
function pointTo(team, reason){
  if (state === 'dead') return;
  state = 'dead'; timer = 1.6; ball.live = false;
  showMsg(reason + (team === 0 ? '  あなたのポイント！' : '  CPUのポイント'), 1.6);
  score.pts[team]++;
  const [a, b] = score.pts;
  if ((a >= 4 || b >= 4) && Math.abs(a - b) >= 2) {
    const w = a > b ? 0 : 1;
    score.games[w]++; score.pts = [0, 0]; server = 1 - server;
    const [g0, g1] = score.games;
    if ((g0 >= 6 || g1 >= 6) && Math.abs(g0 - g1) >= 2) {
      state = 'over'; timer = 0;
      showMsg((g0 > g1 ? '🏆 あなたの勝ち！' : 'CPUの勝ち…') + `  ${g0}-${g1}\nクリック/タップでメニュー`, 999);
      return;
    }
    showMsg((w === 0 ? 'あなたが' : 'CPUが') + 'ゲームを取りました', 1.6);
  }
}
function fault(reason){
  state = 'dead'; ball.live = false; timer = 1.2;
  faults++;
  if (faults >= 2) { faults = 0; state = 'rally'; pointTo(1 - server, 'ダブルフォルト'); return; }
  showMsg('フォルト（' + reason + '）', 1.2);
  pendingSecondServe = true;
}
let pendingSecondServe = false, hitFrom = null, tossing = false;

function inCourt(x, y, team){ // does (x,y) lie in team's court half?
  const W = mode === 'doubles' ? DW : SW;
  return Math.abs(x) <= W + 0.05 && sideSign(team) * y >= 0 && Math.abs(y) <= HL + 0.05;
}
function inServiceBox(x, y, recvTeam){
  const s = sideSign(recvTeam);
  const boxSign = -sideSign(server) * serveSide; // x-sign of target box
  return s * y >= 0 && s * y <= SL + 0.05 && x * boxSign >= -0.05 && Math.abs(x) <= SW + 0.05;
}

// ---- update ----
function predictAtY(yLine){
  if (Math.abs(ball.vy) < 0.01) return ball.x;
  const t = (yLine - ball.y) / ball.vy;
  return t > 0 ? ball.x + ball.vx * t : ball.x;
}
function bouncePoint(){
  // solve z(t)=0
  const a = -0.5 * G, b = ball.vz, c = ball.z;
  const t = (-b - Math.sqrt(b * b - 4 * a * c)) / (2 * a);
  return { x: ball.x + ball.vx * t, y: ball.y + ball.vy * t, t };
}
function movePlayer(p, tx, ty, dt, spd){
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
  if (d < 0.05) return;
  const m = Math.min(d, spd * dt);
  p.x += dx / d * m; p.y += dy / d * m;
}
function clampSide(p){
  const s = sideSign(p.team);
  if (s * p.y < 0.6) p.y = s * 0.6;
  p.y = Math.max(-HL - 4, Math.min(HL + 4, p.y));
  p.x = Math.max(-VIEW_W / 2 + 0.3, Math.min(VIEW_W / 2 - 0.3, p.x));
  p.y = Math.min(p.y, HL + 3.5);
}

function update(dt){
  if (msgTimer > 0 && msgTimer < 900) { msgTimer -= dt; if (msgTimer <= 0 && state !== 'serve') msgEl.textContent = ''; }
  if (state === 'menu' || state === 'over') { if (state === 'over' && serveRequest) { serveRequest = false; state = 'menu'; menu.classList.remove('hidden'); msgEl.textContent = ''; } serveRequest = false; return; }

  // human movement
  let mx = 0, my = 0;
  if (keys['arrowleft'] || keys['a']) mx -= 1;
  if (keys['arrowright'] || keys['d']) mx += 1;
  if (keys['arrowup'] || keys['w']) my -= 1;
  if (keys['arrowdown'] || keys['s']) my += 1;
  const hs = 4.9;
  if (state === 'serve' && servingPlayer() === human) {
    human.x += mx * hs * dt * 0.5;
    const lim = serveSide > 0 ? [0.3, SW] : [-SW, -0.3];
    human.x = Math.max(lim[0], Math.min(lim[1], human.x)); human.y = HL + 0.4;
  } else if (touch) {
    movePlayer(human, touch.x, touch.y, dt, hs);
  } else if (mx || my) {
    const l = Math.hypot(mx, my); human.x += mx / l * hs * dt; human.y += my / l * hs * dt;
  }
  clampSide(human);

  for (const p of players) {
    const d = Math.hypot(p.x - (p.px ?? p.x), p.y - (p.py ?? p.y));
    if (d < 0.5 && dt > 0) p.vxs = (p.vxs || 0) * 0.92 + ((p.x - (p.px ?? p.x)) / dt) * 0.08;
    p.px = p.x; p.py = p.y;
    if (d < 0.5) { p.walk = (p.walk || 0) + d * 3.4; p.mv = (p.mv || 0) * 0.9 + (d / dt > 0.5 ? 1 : 0) * 0.1; }
  }
  for (const p of players) {
    p.cool -= dt; p.swing -= dt; p.label = (p.label || 0) - dt; p.st = (p.st ?? 9) + dt;
    // 打つ前の準備動作（テイクバック）
    let target = 0;
    if (state === 'serve' && p === servingPlayer()) { target = tossing ? 1 : 0; p.prepType = 'sm'; }
    else if (state === 'rally' && lastHitter && lastHitter.team !== p.team && !(isServe && bounces === 0 && false) && p.st > 0.5) {
      const d = Math.hypot(ball.x - p.x, ball.y - p.y);
      const coming = (ball.y - p.y) * ball.vy < 0 || d < 1.6;
      if (coming && d < 5) {
        target = Math.max(0, Math.min(1, 1 - (d - 1.5) / 3));
        const sd = (ball.x - p.x) * sideSign(p.team) >= 0 ? 'f' : 'b';

    const LW = toS([-0.2 * c2, 0.2 * s2, 0.66]), RW = toS([0.2 * c2, -0.2 * s2, 0.66]);
    const NK = toS([0, 0, 1.42]);
    // 横向きでも体の厚みが残るように最小幅を確保
    const widen = (A, B, m) => { const cx = (A[0] + B[0]) / 2, hw = Math.abs(A[0] - B[0]) / 2; if (hw < m) { const sgn = A[0] < B[0] ? -1 : 1; A[0] = cx + sgn * m; B[0] = cx - sgn * m; } };
    widen(LS, RS, S(0.25)); widen(LW, RW, S(0.18));
    ctx.beginPath();
    ctx.moveTo(LS[0], LS[1] + S(0.06));
    ctx.quadraticCurveTo(LS[0], LS[1] - S(0.05), (LS[0] + NK[0]) / 2, NK[1] + S(0.04));
    ctx.lineTo((RS[0] + NK[0]) / 2, NK[1] + S(0.04));
    ctx.quadraticCurveTo(RS[0], RS[1] - S(0.05), RS[0], RS[1] + S(0.06));
    ctx.quadraticCurveTo(RS[0] - (RS[0] - RW[0]) * 0.2, (RS[1] + RW[1]) / 2, RW[0], RW[1]);
    ctx.lineTo(LW[0], LW[1]);
    ctx.quadraticCurveTo(LS[0] - (LS[0] - LW[0]) * 0.2, (LS[1] + LW[1]) / 2, LS[0], LS[1] + S(0.06));
    ctx.closePath(); ctx.fill();
    const g = ctx.createLinearGradient(Math.min(LS[0], RS[0]), 0, Math.max(LS[0], RS[0]), 0);
    g.addColorStop(0, 'rgba(255,255,255,.28)'); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.28)');
    ctx.fillStyle = g; ctx.fill(); }
  // 肩のライン（体のひねりが分かるように）
  { const L = toS([-0.3 * twc, 0.3 * tws, 1.25]), R = toS([0.3 * twc, -0.3 * tws, 1.25]);
    line([L, R], S(0.13), 'rgba(0,0,0,.28)');
  }
  // 頭
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(x, headY, S(0.24), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3b2a1e';
  ctx.beginPath();
  if (fromBack) ctx.arc(x, headY - S(0.02), S(0.245), 0, Math.PI * 2);
  else ctx.arc(x, headY - S(0.04), S(0.245), Math.PI * 1.05, Math.PI * 1.95);
  ctx.fill();
  if (!fromBack) { ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x - S(0.08), headY + S(0.02), S(0.03), 0, 7); ctx.arc(x + S(0.08), headY + S(0.02), S(0.03), 0, 7); ctx.fill(); }
  ctx.fillStyle = shade(x, headY, S(0.25)); ctx.beginPath(); ctx.arc(x, headY, S(0.25), 0, Math.PI * 2); ctx.fill();
  front.forEach(f => f());
  ctx.lineCap = 'butt';
  if (p.label > 0) {
    ctx.globalAlpha = Math.min(1, p.label * 2);
    ctx.font = `bold ${Math.max(11 * devicePixelRatio, S(0.6))}px sans-serif`; ctx.textAlign = 'center';
    ctx.lineWidth = S(0.12); ctx.strokeStyle = '#000';
    const t = (SHOT_NAME[p.shot] || '') + (p.tag ? ' ' + p.tag : '');
    const ly = y - S(2.6) - S((0.9 - p.label) * 0.8);
    ctx.strokeText(t, x, ly);
    ctx.fillStyle = p.tag === '詰まった！' ? '#ff6b6b' : p.tag === '正面…' ? '#c9c9c9' : p.tag ? '#ff9f1c' : p.shot === 'sm' ? '#ff5fd2' : p.shot && p.shot[0] === 'b' ? '#5fd0ff' : '#ffd23f';
    ctx.fillText(t, x, ly);
    ctx.globalAlpha = 1;
  }
  if (p.isHuman) { ctx.fillStyle = '#fff'; ctx.font = `bold ${S(0.55)}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('YOU', x, y - S(2.05)); }
}
function drawBall(){
  if (!ball) return;
  const [gx, gy, f] = P(ball.x, ball.y, 0), [bx, by] = P(ball.x, ball.y, Math.max(0, ball.z));
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(gx, gy, Math.max(2, f * 0.12), Math.max(1, f * 0.06), 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8ff3a';
  ctx.beginPath(); ctx.arc(bx, by, Math.max(2.5, f * 0.12), 0, Math.PI * 2); ctx.fill();
}

let last = performance.now();
function loop(now){
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  const steps = 4;
  for (let i = 0; i < steps; i++) update(dt / steps);
  if (ball) draw(); else { ctx.fillStyle = '#2e6b45'; ctx.fillRect(0, 0, cv.width, cv.height); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
